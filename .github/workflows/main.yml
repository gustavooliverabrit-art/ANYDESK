name: Windows Cloud PC - AnyDesk (High Performance - 128GB)

on:
  workflow_dispatch: # Permite rodar manualmente quando quiser

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080 # Máximo de 7 dias
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install AnyDesk
        run: |
          Write-Host "Baixando AnyDesk..."
          # Tenta usar um mirror mais rápido se disponível, senão usa o padrão
          $anydeskUrl = "https://download.anydesk.com/AnyDesk.exe"
          
          # Baixa o arquivo
          Invoke-WebRequest -Uri $anydeskUrl -OutFile "$env:TEMP\AnyDesk.exe"
          
          Write-Host "Instalando AnyDesk..."
          # Instala silenciosamente
          Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "/SILENT /NORESTART" -Wait
          
          Write-Host "AnyDesk instalado com sucesso."

      - name: Configure AnyDesk & Get ID
        id: config-anydesk
        run: |
          $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          
          # Inicia o serviço
          Start-Process $anydeskPath -WindowStyle Hidden
          
          # Reduz o sleep para 5 segundos (pode ser arriscado, mas mais rápido)
          Start-Sleep -Seconds 5 

          # Obtém o ID
          $id = & $anydeskPath --get-id
          
          # Define senha
          & $anydeskPath --password 1234
          
          Write-Host ">>> SEU ID É: $id <<<"
          echo "ANYDESK_ID=$id" >> $env:GITHUB_OUTPUT

      - name: Optimize System Resources
        run: |
          # Aumenta o limite de memória virtual para evitar crashes em tarefas pesadas
          Write-Host "Otimizando recursos do sistema..."
          $compSystem = [wmiclass]"\\.\root\cimv2:Win32_ComputerSystem"
          $currentMode = $compSystem.GetWmiProperty($null, "PowerScheme")
          
          # Garante que o plano de energia está em Alta Performance
          powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c
          
          Write-Host "Recursos otimizados para 128GB RAM."

      - name: Keep Connection Alive
        run: |
          Write-Host "Monitorando conexão e mantendo runner ativo..."
          while ($true) {
              # Verifica se o processo está vivo
              if (-not (Get-Process -Name AnyDesk -ErrorAction SilentlyContinue)) {
                  Write-Host "Processo fechado. Reiniciando..."
                  $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
                  $process = Start-Process $anydeskPath -WindowStyle Hidden -PassThru
                  if ($process) {
                      $process.PriorityClass = "AboveNormal"
                  }
                  Start-Sleep -Seconds 5
              }
              
              # Atualiza o summary periodicamente para manter o job ativo visualmente
              $env:GITHUB_STEP_SUMMARY += "`n**Status:** Conectado via AnyDesk. Uso de Memória: $(Get-CimInstance Win32_OperatingSystem | Select-Object @{Name='Used';Expression={$_.TotalVisibleMemorySize - $_.FreePhysicalMemory}}, @{Name='Free';Expression={$_.FreePhysicalMemory}}} MB"`
              Start-Sleep -Seconds 60
          }
