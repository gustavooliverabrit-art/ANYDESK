name: Windows Cloud PC - AnyDesk (Fast & Lightweight)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10080
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install AnyDesk (Lightweight)
        run: |
          Write-Host "Baixando instalador leve..."
          # Usa o instalador web que é menor (~2MB) e baixa o resto durante a instalação
          Invoke-WebRequest -Uri "https://anydesk.com/pt/downloads#win" -OutFile "$env:TEMP\anydesk.html"
          
          # Extrai o link direto do instalador do HTML baixado
          $html = Get-Content "$env:TEMP\anydesk.html" -Raw
          $linkMatch = [regex]::match($html, 'href="([^"]+anydesk\.exe[^"]+)"')
          if ($linkMatch.Success) {
              $directLink = $linkMatch.Groups[1].Value
              Write-Host "Download direto encontrado: $directLink"
              Invoke-WebRequest -Uri $directLink -OutFile "$env:TEMP\AnyDesk.exe"
          } else {
              Write-Host "Link direto não encontrado, usando fallback..."
              Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "$env:TEMP\AnyDesk.exe"
          }

          Write-Host "Instalando AnyDesk..."
          Start-Process -FilePath "$env:TEMP\AnyDesk.exe" -ArgumentList "/SILENT /NORESTART" -Wait
          Write-Host "AnyDesk instalado com sucesso."

      - name: Configure AnyDesk & Get ID
        id: config-anydesk
        run: |
          $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
          
          # Inicia sem aceleração de hardware para evitar gargalo em VMs sem GPU
          Write-Host "Iniciando AnyDesk sem aceleração de hardware..."
          Start-Process $anydeskPath -WindowStyle Hidden -ArgumentList "--no-hardware-acceleration"
          
          # Tempo reduzido para 5 segundos
          Start-Sleep -Seconds 5 

          # Obtém o ID
          $id = & $anydeskPath --get-id
          
          # Define senha
          & $anydeskPath --password 1234
          
          Write-Host ">>> SEU ID É: $id <<<"
          echo "ANYDESK_ID=$id" >> $env:GITHUB_OUTPUT

      - name: Keep Connection Alive
        run: |
          Write-Host "Monitorando conexão..."
          while ($true) {
              if (-not (Get-Process -Name AnyDesk -ErrorAction SilentlyContinue)) {
                  Write-Host "Reiniciando..."
                  $anydeskPath = "${env:ProgramFiles(x86)}\AnyDesk\AnyDesk.exe"
                  Start-Process $anydeskPath -WindowStyle Hidden -ArgumentList "--no-hardware-acceleration"
                  Start-Sleep -Seconds 5
              }
              $env:GITHUB_STEP_SUMMARY += "`nConectado via AnyDesk."
              Start-Sleep -Seconds 60
          }
